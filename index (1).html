<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARAVEX</title>
<style>
:root{--bg:#f2f5f3;--cd:#fff;--tx:#17261c;--mu:#66756b;--pr:#1f5130;--ac:#e0a526;--bd:#d9e1db;--rd:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1712;--cd:#18231c;--tx:#e6eee8;--mu:#93a498;--pr:#6fcf8a;--ac:#f0b93a;--bd:#2a3a2f;--rd:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--pr);color:#fff}
header b{font-size:20px;letter-spacing:.5px}
header button{background:none;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.p{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:600 16px inherit}
@media(prefers-color-scheme:dark){button.p{color:#0f1712}}
button.l{background:none;border:0;color:var(--pr);padding:0;font:inherit;text-decoration:underline}
button.x{background:none;border:0;color:var(--rd);font-size:18px}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;white-space:nowrap;padding:9px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--cd);color:var(--tx);font:inherit}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
@media(prefers-color-scheme:dark){.tabs button.on{color:#0f1712}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--bg);border-radius:10px;padding:10px}
.k small{display:block;color:var(--mu);font-size:12px}.k b{font-size:20px}
.k.h{grid-column:1/-1;border-left:5px solid var(--ac)}.k.h b{font-size:26px}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}
.it:last-child{border:0}.it small{color:var(--mu);display:block}
.lote{display:block;width:100%;text-align:left;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;color:var(--tx);font:inherit}
.tag{font-size:12px;border-radius:10px;padding:2px 8px;background:var(--ac);color:#000}
.tag.f{background:var(--bd);color:var(--mu)}
.err{color:var(--rd);font-size:14px;margin-top:8px}
body.out{background:#000;min-height:100vh}
body.out header{display:none}body.out main{padding-top:20px}
.login{background:#0a0a0a;color:#e8d28a;border-radius:24px;padding:18px 22px 26px;text-align:center;border:1px solid #b8923a}
.login img{width:78%;max-width:300px;display:block;margin:0 auto}
.login h2{font-size:21px;margin:6px 0 4px;color:#e0bd62}.login p{margin:0 0 16px;color:#b9a36a;font-size:15px}
.login input{background:#141414;border:1.5px solid #8a6d2b;border-radius:14px;padding:15px;color:#f3e3b0;margin-bottom:12px}
.login input::placeholder{color:#8f7d4e}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;background:none;border:0;font-size:20px;padding:8px}
.login button.p{background:linear-gradient(#ecc96e,#a77c22);color:#1a1205;border-radius:14px;padding:15px;font-size:18px}
.login .l{display:block;margin:16px auto 0;color:#e0bd62}
header{background:#000!important;border-bottom:2px solid #b8923a}header b{color:#e0bd62;display:flex;align-items:center;gap:10px}header b img{height:38px;width:38px;border-radius:50%}
.vazio{color:var(--mu);text-align:center;padding:14px}
</style>
</head>

const $=s=>document.querySelector(s);$("#hl").src=LOGO;{const l=document.createElement("link");l.rel="icon";l.href=LOGO;document.head.append(l)}
const hoje=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=v=>Number(v)||0;
const f=(v,d=1)=>isFinite(v)?v.toLocaleString("pt-PT",{maximumFractionDigits:d}):"–";
const sum=(a,k)=>a.reduce((t,x)=>t+n(x[k]),0);
const dias=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/864e5));

let user=null,lotes=[],lote=null,regs=[],tab="resumo",erro="",unsubL=null,unsubR=null;

onAuthStateChanged(auth,u=>{
  user=u;$("#sair").hidden=!u;
  unsubL&&unsubL();unsubR&&unsubR();lote=null;
  if(u){unsubL=onSnapshot(query(collection(db,"lotes"),orderBy("entrada","desc")),s=>{lotes=s.docs.map(d=>({id:d.id,...d.data()}));
    if(lote)lote=lotes.find(l=>l.id===lote.id)||null;render()},e=>{erro=e.message;render()})}
  render();
});
$("#sair").onclick=()=>signOut(auth);

function abrir(id){
  lote=lotes.find(l=>l.id===id);tab="resumo";regs=[];unsubR&&unsubR();
  unsubR=onSnapshot(query(collection(db,"lotes",id,"registos"),orderBy("data","desc")),s=>{regs=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  render();
}

function calc(l,r){
  const d=r.filter(x=>x.tipo==="diario"),fin=r.filter(x=>x.tipo==="fin");
  const mortos=sum(d,"mortos"),racao=sum(d,"racao");
  const pesos=r.filter(x=>x.tipo==="peso").sort((a,b)=>a.data<b.data?-1:1);
  const fim=l.saida?.data,pF=l.saida?n(l.saida.pesoFinal):0;
  const pAt=pF||(pesos.length?n(pesos.at(-1).peso):n(l.pesoIni));
  const vivos=n(l.animais)-mortos;
  const ganhoKg=(vivos*pAt-n(l.animais)*n(l.pesoIni))/1000;
  const dd=dias(l.entrada,fim||hoje());
  const rec=sum(fin.filter(x=>x.cat==="venda"),"valor"),des=sum(fin.filter(x=>x.cat==="despesa"),"valor");
  return{mortos,racao,pAt,vivos,dd,mort:mortos/n(l.animais)*100,via:100-mortos/n(l.animais)*100,
    ca:ganhoKg>0?racao/ganhoKg:NaN,gmd:dd?(pAt-n(l.pesoIni))/dd:NaN,rec,des,lucro:rec-des,custoKg:ganhoKg>0?des/(vivos*pAt/1000):NaN,agua:sum(d,"agua")};
}

function render(){
  const A=$("#app");document.body.classList.toggle("out",!user);
  if(!user){A.innerHTML=`<div class="card login"><img src="${LOGO}" alt="Adolfo, Raul e Arão – Criação de frangos"><h2>Entrar na sua conta</h2><p>Introduza o seu e-mail e a palavra-passe</p><form data-f="login"><input name="email" type="email" required placeholder="E-mail" autocomplete="username"><div class="pw"><input name="senha" type="password" required placeholder="Palavra-passe" autocomplete="current-password"><button type="button" data-olho aria-label="Mostrar palavra-passe">👁</button></div><button class="p">Entrar</button><div class="err">${esc(erro)}</div></form><button type="button" class="l" data-reset>Esqueci a palavra-passe</button></div>`;return}
  if(!lote){
    A.innerHTML=`<div class="card"><h2>Novo lote</h2><form data-f="lote"><label>Nome do lote</label><input name="nome" required placeholder="Ex.: Lote 1 – Novembro"><div class="row"><div><label>Data de entrada</label><input name="entrada" type="date" value="${hoje()}" required></div><div><label>Nº de pintos</label><input name="animais" type="number" min="1" required></div></div><label>Peso inicial médio (g)</label><input name="pesoIni" type="number" step="any" value="40" required><button class="p">Criar lote</button></form></div>
    <h2>Lotes</h2>${lotes.length?lotes.map(l=>`<button class="lote" data-abrir="${l.id}"><b>${esc(l.nome)}</b> <span class="tag ${l.saida?"f":""}">${l.saida?"Fechado":"Em curso"}</span><br><small>${l.entrada} · ${f(l.animais,0)} animais</small></button>`).join(""):`<div class="vazio">Ainda não há lotes. Cria o primeiro acima.</div>`}<div class="err">${esc(erro)}</div>`;return}
  const c=calc(lote,regs);
  const T=[["resumo","Resumo"],["diario","Diário"],["peso","Pesagem"],["fin","Contas"],["fecho","Saída"]];
  let b="";
  if(tab==="resumo")b=`<div class="grid"><div class="k h"><small>Conversão alimentar</small><b>${f(c.ca,2)}</b></div>
  <div class="k"><small>Mortalidade</small><b>${f(c.mort)}%</b></div><div class="k"><small>Viabilidade</small><b>${f(c.via)}%</b></div>
  <div class="k"><small>Animais vivos</small><b>${f(c.vivos,0)}</b></div><div class="k"><small>Dias de criação</small><b>${c.dd}</b></div>
  <div class="k"><small>Peso médio atual</small><b>${f(c.pAt,0)} g</b></div><div class="k"><small>Ganho médio diário</small><b>${f(c.gmd,1)} g</b></div>
  <div class="k"><small>Ração total</small><b>${f(c.racao,0)} kg</b></div><div class="k"><small>Água total</small><b>${f(c.agua,0)} L</b></div>
  <div class="k"><small>Receitas</small><b>${f(c.rec,0)}</b></div><div class="k"><small>Despesas</small><b>${f(c.des,0)}</b></div>
  <div class="k"><small>Lucro</small><b style="color:${c.lucro<0?"var(--rd)":"inherit"}">${f(c.lucro,0)}</b></div><div class="k"><small>Custo por kg</small><b>${f(c.custoKg,2)}</b></div></div>`;
  if(tab==="diario")b=`<div class="card"><h3>Registo do dia</h3><form data-f="diario"><label>Data</label><input name="data" type="date" value="${hoje()}" required><div class="row"><div><label>Mortos</label><input name="mortos" type="number" min="0" value="0"></div><div><label>Ração (kg)</label><input name="racao" type="number" step="any" min="0" value="0"></div><div><label>Água (L)</label><input name="agua" type="number" step="any" min="0" value="0"></div></div><label>Causa / saúde / medicamento (opcional)</label><input name="obs"><button class="p">Guardar registo</button></form></div>`+lista("diario",r=>`${r.data}<small>${r.mortos} mortos · ${r.racao} kg ração · ${r.agua} L água${r.obs?" · "+esc(r.obs):""}</small>`);
  if(tab==="peso")b=`<div class="card"><h3>Pesagem</h3><form data-f="peso"><label>Data</label><input name="data" type="date" value="${hoje()}" required><div class="row"><div><label>Peso médio (g)</label><input name="peso" type="number" step="any" min="1" required></div><div><label>Nº pesados</label><input name="amostra" type="number" min="1"></div></div><button class="p">Guardar pesagem</button></form></div>`+lista("peso",r=>`${r.data}<small>${f(r.peso,0)} g${r.amostra?" · "+r.amostra+" aves pesadas":""}</small>`);
  if(tab==="fin")b=`<div class="card"><h3>Venda ou despesa</h3><form data-f="fin"><label>Data</label><input name="data" type="date" value="${hoje()}" required><label>Tipo</label><select name="cat"><option value="despesa">Despesa</option><option value="venda">Venda</option></select><label>Descrição</label><input name="desc" required placeholder="Ex.: ração, vacinas, venda de frangos"><label>Valor</label><input name="valor" type="number" step="any" min="0" required><button class="p">Guardar</button></form></div>`+lista("fin",r=>`${esc(r.desc)}<small>${r.data} · ${r.cat==="venda"?"Venda":"Despesa"} · ${f(r.valor,2)}</small>`);
  if(tab==="fecho"){const s=lote.saida;b=`<div class="card"><h3>Saída do lote</h3><form data-f="fecho"><label>Data de saída</label><input name="data" type="date" value="${s?.data||hoje()}" required><div class="row"><div><label>Animais vendidos</label><input name="vendidos" type="number" min="0" value="${s?.vendidos??c.vivos}" required></div><div><label>Peso final médio (g)</label><input name="pesoFinal" type="number" step="any" min="1" value="${s?.pesoFinal??""}" required></div></div><button class="p">${s?"Atualizar saída":"Fechar lote"}</button></form>${s?`<p><button class="l" data-reabrir>Reabrir lote</button></p>`:""}<p><button class="l" style="color:var(--rd)" data-apagarlote>Apagar este lote</button></p></div>`}
  A.innerHTML=`<p><button class="l" data-voltar>← Todos os lotes</button></p><h2>${esc(lote.nome)} <span class="tag ${lote.saida?"f":""}">${lote.saida?"Fechado":"Em curso"}</span></h2><div class="tabs">${T.map(([k,t])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${t}</button>`).join("")}</div>${b}<div class="err">${esc(erro)}</div>`;
}

function lista(tipo,fn){
  const r=regs.filter(x=>x.tipo===tipo);
  return `<div class="card"><h3>Registos</h3>${r.length?r.map(x=>`<div class="it"><div>${fn(x)}</div><button class="x" data-del="${x.id}" aria-label="Apagar">×</button></div>`).join(""):`<div class="vazio">Ainda não há registos.</div>`}</div>`;
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;erro="";
  try{
    if(t.dataset.olho!==undefined){const i=document.querySelector("input[name=senha]");i.type=i.type==="password"?"text":"password"}
    else if(t.dataset.reset!==undefined){const em=document.querySelector("input[name=email]").value;if(!em)erro="Escreve primeiro o teu e-mail.";else{await sendPasswordResetEmail(auth,em);erro="Enviámos um e-mail para criares uma nova senha."}render()}
    else if(t.dataset.abrir)abrir(t.dataset.abrir);
    else if(t.dataset.voltar!==undefined){lote=null;unsubR&&unsubR();render()}
    else if(t.dataset.tab){tab=t.dataset.tab;render()}
    else if(t.dataset.del){if(confirm("Apagar este registo?"))await deleteDoc(doc(db,"lotes",lote.id,"registos",t.dataset.del))}
    else if(t.dataset.reabrir!==undefined)await updateDoc(doc(db,"lotes",lote.id),{saida:null});
    else if(t.dataset.apagarlote!==undefined){if(confirm("Apagar o lote? Os registos ficam guardados mas deixam de aparecer.")){const id=lote.id;lote=null;unsubR&&unsubR();await deleteDoc(doc(db,"lotes",id))}}
  }catch(x){erro=x.message;render()}
});

document.addEventListener("submit",async e=>{
  const fm=e.target.closest("form");if(!fm)return;e.preventDefault();erro="";
  const d=Object.fromEntries(new FormData(fm));
  try{
    if(fm.dataset.f==="login")await signInWithEmailAndPassword(auth,d.email,d.senha);
    else if(fm.dataset.f==="lote"){await addDoc(collection(db,"lotes"),{nome:d.nome,entrada:d.entrada,animais:n(d.animais),pesoIni:n(d.pesoIni),saida:null});fm.reset()}
    else if(fm.dataset.f==="fecho")await updateDoc(doc(db,"lotes",lote.id),{saida:{data:d.data,vendidos:n(d.vendidos),pesoFinal:n(d.pesoFinal)}});
    else{const o={tipo:fm.dataset.f,...d,criadoPor:user.email};
      ["mortos","racao","agua","peso","amostra","valor"].forEach(k=>{if(k in o)o[k]=n(o[k])});
      await addDoc(collection(db,"lotes",lote.id,"registos"),o);fm.reset();render()}
  }catch(x){erro=fm.dataset.f==="login"?"E-mail ou senha incorretos.":x.message;render()}
});
render();
</script>
</body>
</html>
